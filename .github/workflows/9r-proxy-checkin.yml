name: 9R-Proxy 代理同步

on:
  schedule:
    # 北京时间 18:00 = UTC 10:00
    - cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./9r-proxy
    permissions:
      contents: write

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 📦 安装依赖
        run: pip install -r requirements.txt

      - name: 🔄 同步 9router 代理池
        env:
          R9_PASSWORD: ${{ secrets.R9_PASSWORD }}
          R9_COOKIE: ${{ vars.R9_COOKIE }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python proxy-manager.py

      - name: 📄 提交 socks5-otc.txt
        if: always()
        working-directory: .
        run: |
          if [ -f 9r-proxy/socks5-otc.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add 9r-proxy/socks5-otc.txt
            if git diff --cached --quiet; then
              echo "⏭️ 无变化，跳过"
            else
              git commit -m "🔄 更新 socks5-otc.txt"
              git push
            fi
          fi
